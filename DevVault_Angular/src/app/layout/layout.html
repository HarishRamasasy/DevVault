<mat-sidenav-container class="h-screen bg-gray-50">
  <mat-sidenav
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpened.set($event)"
    [class]="sidebarCollapsed() ? 'w-[72px]' : 'w-[260px]'"
    class="!border-0 !border-r !border-gray-200 transition-[width] duration-200"
  >
    <app-sidebar [collapsed]="sidebarCollapsed()" (navigated)="closeSidenavOnMobile()" />
  </mat-sidenav>

  <mat-sidenav-content class="flex min-h-screen flex-col">
    <app-navbar (menuToggle)="toggleSidenav()" />
    <app-breadcrumb />
    <main class="flex-1 overflow-y-auto p-4 sm:p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
