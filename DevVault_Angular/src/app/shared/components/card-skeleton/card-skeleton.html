@switch (variant) {
  @case ('bookmark') {
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" role="status" aria-label="Loading bookmarks">
      @for (i of placeholders; track i) {
        <div
          class="flex h-40 flex-col justify-between rounded-2xl border border-gray-200 bg-white p-5 shadow-sm shadow-gray-100"
        >
          <div class="flex items-center justify-between">
            <div class="h-4 w-16 animate-pulse rounded-md bg-gray-200"></div>
            <div class="h-7 w-7 animate-pulse rounded-lg bg-gray-100"></div>
          </div>
          <div class="space-y-2">
            <div class="h-4 w-3/4 animate-pulse rounded bg-gray-200"></div>
            <div class="h-3 w-full animate-pulse rounded bg-gray-100"></div>
            <div class="h-3 w-2/3 animate-pulse rounded bg-gray-100"></div>
          </div>
          <div class="flex items-center justify-between">
            <div class="h-3 w-20 animate-pulse rounded bg-gray-100"></div>
            <div class="h-3 w-12 animate-pulse rounded bg-gray-100"></div>
          </div>
        </div>
      }
    </div>
  }
  @case ('folder') {
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" role="status" aria-label="Loading folders">
      @for (i of placeholders; track i) {
        <div
          class="flex h-28 flex-col justify-between rounded-2xl border border-gray-200 bg-white p-5 shadow-sm shadow-gray-100"
        >
          <div class="flex items-center gap-3">
            <div class="h-10 w-10 animate-pulse rounded-xl bg-gray-200"></div>
            <div class="flex-1 space-y-2">
              <div class="h-4 w-2/3 animate-pulse rounded bg-gray-200"></div>
              <div class="h-3 w-1/3 animate-pulse rounded bg-gray-100"></div>
            </div>
          </div>
          <div class="h-3 w-full animate-pulse rounded bg-gray-100"></div>
        </div>
      }
    </div>
  }
  @case ('tag') {
    <div
      class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
      role="status"
      aria-label="Loading tags"
    >
      @for (i of placeholders; track i) {
        <div class="flex h-20 flex-col justify-center rounded-2xl border border-gray-200 bg-white p-5 shadow-sm shadow-gray-100">
          <div class="flex items-center gap-3">
            <div class="h-3 w-3 animate-pulse rounded-full bg-gray-200"></div>
            <div class="flex-1 space-y-2">
              <div class="h-4 w-2/3 animate-pulse rounded bg-gray-200"></div>
              <div class="h-3 w-1/3 animate-pulse rounded bg-gray-100"></div>
            </div>
          </div>
        </div>
      }
    </div>
  }
}
