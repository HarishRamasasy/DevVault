<div class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-gray-200 bg-white px-6 py-16 text-center">
  <span class="flex h-14 w-14 items-center justify-center rounded-full bg-blue-50 text-blue-600">
    <mat-icon class="!text-[28px]">{{ icon }}</mat-icon>
  </span>
  <h3 class="mt-4 text-base font-semibold text-gray-900">{{ title }}</h3>
  @if (message) {
    <p class="mt-1.5 max-w-sm text-sm text-gray-500">{{ message }}</p>
  }
  @if (actionLabel) {
    <button
      type="button"
      (click)="action.emit()"
      class="mt-5 btn-primary"
    >
      {{ actionLabel }}
    </button>
  }
</div>
