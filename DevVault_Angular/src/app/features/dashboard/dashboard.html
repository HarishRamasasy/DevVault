<div class="space-y-8">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Welcome back, {{ currentUser()?.name }}</h1>
    <p class="mt-1 text-sm text-gray-500">Manage your development resources from one place.</p>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    @for (stat of stats(); track stat.label) {
      <div
        class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm shadow-gray-100 transition hover:shadow-md"
      >
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-500">{{ stat.label }}</span>
          <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-50 text-blue-600">
            <mat-icon class="!text-[20px]">{{ stat.icon }}</mat-icon>
          </span>
        </div>
        <p class="mt-4 text-3xl font-bold text-gray-900">{{ stat.value }}</p>
      </div>
    }
  </div>
</div>
