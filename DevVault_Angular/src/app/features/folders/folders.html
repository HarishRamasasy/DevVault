<div class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Folders</h1>
      <p class="mt-1 text-sm text-gray-500">Group your bookmarks into logical collections.</p>
    </div>
    <button
      type="button"
      (click)="openCreateDialog()"
      class="flex items-center justify-center gap-1.5 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700"
    >
      <mat-icon class="!text-[18px]">add</mat-icon>
      New Folder
    </button>
  </div>

  @if (error()) {
    <div class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
      {{ error() }}
    </div>
  }

  @if (loading()) {
    <app-folder-skeleton [count]="6" />
  } @else if (folders().length) {
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (folder of folders(); track folder._id) {
        <app-folder-card [folder]="folder" (edit)="openEditDialog($event)" (remove)="confirmDelete($event)" />
      }
    </div>
  } @else {
    <app-empty-state
      icon="folder_off"
      title="No folders yet."
      message="Create a folder to start organizing your bookmarks."
      actionLabel="Create Folder"
      (action)="openCreateDialog()"
    />
  }
</div>
