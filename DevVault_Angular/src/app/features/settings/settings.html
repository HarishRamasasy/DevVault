<div class="mx-auto max-w-3xl space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Settings</h1>
    <p class="mt-1 text-sm text-gray-500">Manage your account and preferences.</p>
  </div>

  <section class="rounded-xl border border-gray-200 bg-white">
    <h2 class="border-b border-gray-100 px-6 py-4 text-base font-semibold text-gray-900">Account</h2>
    @for (link of accountLinks; track link.route) {
      <a
        [routerLink]="link.route"
        class="flex items-center gap-4 border-b border-gray-100 px-6 py-4 transition last:border-0 hover:bg-gray-50"
      >
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-blue-50 text-blue-600">
          <mat-icon class="!text-[20px]">{{ link.icon }}</mat-icon>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block text-sm font-medium text-gray-900">{{ link.label }}</span>
          <span class="block text-sm text-gray-500">{{ link.description }}</span>
        </span>
        <mat-icon class="text-gray-400">chevron_right</mat-icon>
      </a>
    }
  </section>

  <section class="rounded-xl border border-gray-200 bg-white">
    <h2 class="border-b border-gray-100 px-6 py-4 text-base font-semibold text-gray-900">Preferences</h2>
    <div class="flex items-center justify-between gap-4 px-6 py-4">
      <div>
        <p class="text-sm font-medium text-gray-900">Compact sidebar</p>
        <p class="text-sm text-gray-500">Show only icons in the sidebar on desktop screens. Saved on this device.</p>
      </div>
      <mat-slide-toggle
        [checked]="preferences.sidebarCollapsed()"
        (change)="preferences.sidebarCollapsed.set($event.checked)"
        aria-label="Compact sidebar"
      />
    </div>
  </section>
</div>
