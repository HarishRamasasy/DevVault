<div
  class="group flex h-full flex-col rounded-2xl border border-gray-200 bg-white p-5 shadow-sm shadow-gray-100 transition hover:shadow-md"
>
  <div class="flex items-start justify-between gap-2">
    <div class="flex min-w-0 items-center gap-3">
      <span class="h-3 w-3 shrink-0 rounded-full" [style.background]="tag.color"></span>
      <div class="min-w-0">
        <h3 class="truncate text-base font-semibold text-gray-900">{{ tag.name }}</h3>
        <span class="text-xs text-gray-400">
          {{ tag.bookmarkCount }} {{ tag.bookmarkCount === 1 ? 'bookmark' : 'bookmarks' }}
        </span>
      </div>
    </div>

    <button
      type="button"
      [matMenuTriggerFor]="cardMenu"
      aria-label="More actions"
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-gray-400 transition hover:bg-gray-100"
    >
      <mat-icon class="!text-[19px]">more_vert</mat-icon>
    </button>
    <mat-menu #cardMenu="matMenu">
      <button mat-menu-item (click)="edit.emit(tag)">
        <mat-icon>edit</mat-icon>
        <span>Edit</span>
      </button>
      <button mat-menu-item (click)="remove.emit(tag)">
        <mat-icon>delete</mat-icon>
        <span>Delete</span>
      </button>
    </mat-menu>
  </div>
</div>
